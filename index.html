<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ferris Wheel Simulation</title>
    <link rel="stylesheet" href="./src/shared/style.css" />
  </head>
  <body>
    <section id="hud">
      <p class="eyebrow">INTERACTIVE GRAPHICS & TRANSFORMS</p>
      <h1>Level gondolas</h1>
      <p>
        Turntable → wheel → leveling pivot → cabin → rocking seat → rider
        camera.
      </p>
      <p id="status">Ground view · day</p>
      <div class="controls">
        <button id="view">Ride / ground [V]</button
        ><button id="night">Day / night [N]</button
        ><button id="pause">Pause [P]</button
        ><button id="bug" class="secondary">Test leveling fault [B]</button
        ><button id="maps" class="secondary">Toggle maps [M]</button
        ><button id="shadows" class="secondary">Toggle shadows [H]</button>
      </div>
      <p>
        Drag the background to look around. In ground view, scroll to zoom. The
        fault toggle is a deliberate diagnostic.
      </p>
      <p id="metrics"></p>
      <a href="https://github.com/daniel-aguilar03/ferris-wheel-simulation">Source on GitHub</a>
    </section>
    <div id="notice" role="status"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
